name: Bug report
description: Something in Moniflip is broken. For a monitor that won't switch, use "Monitor report".
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: English or Chinese is fine. 中英文均可。
  - type: input
    id: version
    attributes:
      label: Moniflip version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and chip
      placeholder: macOS 15.6, M2 Pro / Windows 11 24H2, x64
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: "In Moniflip, open Settings → General → Diagnostics → Copy (设置 → 通用 → 诊断信息 → 复制), or run `moniflip diagnose`, and paste the result here. Monitor serial numbers are already masked."
      render: text
